services:
  mysql:
    image: mysql:8
    container_name: trinetra-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: trinetra
      MYSQL_DATABASE: trinetra
    volumes:
      - trinetra_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptrinetra"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  trinetra_mysql_data:
